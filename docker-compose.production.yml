version: '3.8'

services:
  farm-backend:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: farm-backend-prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - BCRYPT_ROUNDS=12
      - RATE_LIMIT_TTL=60000
      - RATE_LIMIT_MAX=100
    env_file:
      - .env.production
    depends_on:
      - postgres
    networks:
      - farm-network
    expose:
      - "3000"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    container_name: farm-postgres-prod
    restart: unless-stopped
    environment:
      - POSTGRES_DB=farm_backend
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - farm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d farm_backend"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: farm-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.production.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/ssl/certs
    depends_on:
      - farm-backend
    networks:
      - farm-network

volumes:
  postgres_data:

networks:
  farm-network:
    driver: bridge
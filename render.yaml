services:
  - type: web
    name: farm-backend
    runtime: node
    plan: starter
    dir: .

    buildCommand: |
      npm ci
      npm install -g @nestjs/cli
      node ./node_modules/prisma/build/index.js generate
      npx nest build
      node ./scripts/ensure-render-entrypoint.js

    startCommand: bash ./start.sh

    envVars:
      - key: NODE_ENV
        value: production
      
      - key: PORT
        value: "3000"
      
      # Database connection - get from PostgreSQL service or external DB
      - key: DATABASE_URL
        fromDatabase:
          name: farm-db
          property: connectionString
      
      # External managed Redis URL
      - key: REDIS_URL
        sync: false

      - key: WEB_CONCURRENCY
        value: "1"

      - key: ENABLE_CLUSTER
        value: "false"

      - key: CACHE_TTL_SECONDS
        value: "60"

      # GoDaddy SMTP settings for branded password-reset emails.
      - key: SMTP_HOST
        value: smtpout.secureserver.net
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: 'FARM Support <support@farmapp.africa>'

      # Firebase Admin credentials are stored as Render environment variables.
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_PASSWORD_RESET_CONTINUE_URL
        value: https://farmapp-e2145.firebaseapp.com/admin-reset-password
      
      # CORS configuration
      - key: CORS_ORIGINS
        # Replace with your Cloudflare origin(s), comma-separated if multiple.
        value: https://*.algorandfarm686.workers.dev,http://localhost:3000,http://localhost:3001
      
      # Paystack Configuration
      - key: PAYSTACK_SECRET_KEY
        sync: false
      
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      
      # Ivorypay Configuration
      - key: IVORYPAY_API_KEY
        sync: false
      
      - key: IVORYPAY_BASE_URL
        value: https://api.ivorypay.io
      
      # JWT Configuration
      - key: JWT_SECRET
        sync: false
      
      - key: JWT_EXPIRATION
        value: 3600
      
      - key: JWT_REFRESH_SECRET
        sync: false
      
      - key: JWT_REFRESH_EXPIRATION
        value: 604800
      
      # Cloudinary Configuration
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      
      - key: CLOUDINARY_API_KEY
        sync: false
      
      - key: CLOUDINARY_API_SECRET
        sync: false
      
      # AWS Secrets Manager (optional)
      - key: AWS_REGION
        value: us-east-1
      
      - key: AWS_ACCESS_KEY_ID
        sync: false
      
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
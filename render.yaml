services:
  - type: web
    name: farm-backend
    runtime: node
    plan: starter
    dir: .

    buildCommand: |
      npm ci
      npm install -g @nestjs/cli
      npx prisma generate
      npm run build

    startCommand: bash start.sh

    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        # Replace with your Cloudflare origin(s), comma-separated if multiple.
        value: https://royal-wood-780a.algorandfarm686.workers.dev
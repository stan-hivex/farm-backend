version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.production
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL
      - REDIS_URL
    expose:
      - '3000'
    networks:
      - farm-net

  nginx:
    image: nginx:stable-alpine
    depends_on:
      - backend
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - farm-net

networks:
  farm-net:
    driver: bridge
